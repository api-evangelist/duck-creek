description: Duck Creek does not publish numeric API rate limits. Effective limits are governed by the
  carrier's Duck Creek Anywhere tenant capacity, Suite contract, and any negotiated SLA. Anywhere is documented
  as supporting "thousands of calls" across the Suite but specific per-second/per-minute limits are not
  public.
sources:
  - https://www.duckcreek.com/product/anywhere-integration/
  - https://solutioncenter.duckcreek.com/
notes: No published rate-limit numbers; reconciled=false.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Tenant-bound API capacity
    scope: tenant
    metric: varies
    limit: see Duck Creek Suite contract / SLA
    notes: Per-tenant capacity is governed by the contracted Duck Creek tier and any negotiated SLA addendum.
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429/503 responses.
  - name: Tenant Isolation
    description: Each carrier runs in its own Duck Creek Anywhere tenant; throttling is scoped to the
      tenant.
  - name: SLA Negotiation
    description: Higher capacity is provisioned via Suite contract amendments and reviewed with Duck Creek
      account management.
