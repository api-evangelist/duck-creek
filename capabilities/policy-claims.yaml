naftiko: 1.0.0-alpha2
info:
  label: Duck Creek Policy Administration API — Claims
  description: 'Duck Creek Policy Administration API — Claims. 3 operations. Lead operation: List claims. Self-contained Naftiko
    capability covering one Duck Creek business surface.'
  tags:
  - Duck Creek
  - Claims
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DUCK_CREEK_API_KEY: DUCK_CREEK_API_KEY
capability:
  consumes:
  - type: http
    namespace: policy-claims
    baseUri: https://api.duckcreek.com/v1
    description: Duck Creek Policy Administration API — Claims business capability. Self-contained, no shared references.
    resources:
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: List claims
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: policyId
          in: query
          type: string
          description: Filter claims for a specific policy
        - name: claimStatus
          in: query
          type: string
        - name: lossDateAfter
          in: query
          type: string
        - name: limit
          in: query
          type: integer
      - name: createclaim
        method: POST
        description: Report a new claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: claims-claimId
      path: /claims/{claimId}
      operations:
      - name: getclaim
        method: GET
        description: Get claim details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.DUCK_CREEK_API_KEY}}'
  exposes:
  - type: rest
    namespace: policy-claims-rest
    port: 8080
    description: REST adapter for Duck Creek Policy Administration API — Claims. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/claims
      name: claims
      description: REST surface for claims.
      operations:
      - method: GET
        name: listclaims
        description: List claims
        call: policy-claims.listclaims
        with:
          policyId: rest.policyId
          claimStatus: rest.claimStatus
          lossDateAfter: rest.lossDateAfter
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createclaim
        description: Report a new claim
        call: policy-claims.createclaim
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/claims/{claimid}
      name: claims-claimid
      description: REST surface for claims-claimId.
      operations:
      - method: GET
        name: getclaim
        description: Get claim details
        call: policy-claims.getclaim
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: policy-claims-mcp
    port: 9090
    transport: http
    description: MCP adapter for Duck Creek Policy Administration API — Claims. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-claims
      description: List claims
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: policy-claims.listclaims
      with:
        policyId: tools.policyId
        claimStatus: tools.claimStatus
        lossDateAfter: tools.lossDateAfter
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: report-new-claim
      description: Report a new claim
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: policy-claims.createclaim
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-claim-details
      description: Get claim details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: policy-claims.getclaim
      with:
        claimId: tools.claimId
      outputParameters:
      - type: object
        mapping: $.
