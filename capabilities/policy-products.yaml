naftiko: 1.0.0-alpha2
info:
  label: Duck Creek Policy Administration API — Products
  description: 'Duck Creek Policy Administration API — Products. 1 operations. Lead operation: List insurance products. Self-contained
    Naftiko capability covering one Duck Creek business surface.'
  tags:
  - Duck Creek
  - Products
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DUCK_CREEK_API_KEY: DUCK_CREEK_API_KEY
capability:
  consumes:
  - type: http
    namespace: policy-products
    baseUri: https://api.duckcreek.com/v1
    description: Duck Creek Policy Administration API — Products business capability. Self-contained, no shared references.
    resources:
    - name: products
      path: /products
      operations:
      - name: listproducts
        method: GET
        description: List insurance products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: lineOfBusiness
          in: query
          type: string
          description: Filter by line of business
        - name: state
          in: query
          type: string
          description: Filter products available in a specific US state (2-letter code)
    authentication:
      type: bearer
      token: '{{env.DUCK_CREEK_API_KEY}}'
  exposes:
  - type: rest
    namespace: policy-products-rest
    port: 8080
    description: REST adapter for Duck Creek Policy Administration API — Products. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/products
      name: products
      description: REST surface for products.
      operations:
      - method: GET
        name: listproducts
        description: List insurance products
        call: policy-products.listproducts
        with:
          lineOfBusiness: rest.lineOfBusiness
          state: rest.state
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: policy-products-mcp
    port: 9090
    transport: http
    description: MCP adapter for Duck Creek Policy Administration API — Products. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-insurance-products
      description: List insurance products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: policy-products.listproducts
      with:
        lineOfBusiness: tools.lineOfBusiness
        state: tools.state
      outputParameters:
      - type: object
        mapping: $.
