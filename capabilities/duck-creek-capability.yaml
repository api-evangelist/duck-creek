naftiko: 1.0.0-alpha2
info:
  label: Duck Creek Policy Administration API
  description: Duck Creek Policy Administration API enables product configuration, premium calculation, policy lifecycle management,
    and policy issuance for P&C and specialty insurance carriers. Duck Creek Anywhere provides 2,600+ RESTful APIs across
    all Duck Creek applications using open standards. Supports end-to-end policy management from quoting through renewal.
  tags:
  - Duck
  - Creek
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: duck-creek
    baseUri: https://api.duckcreek.com/v1
    description: Duck Creek Policy Administration API HTTP API.
    authentication:
      type: bearer
      token: '{{DUCK_CREEK_TOKEN}}'
    resources:
    - name: policies
      path: /policies
      operations:
      - name: listpolicies
        method: GET
        description: List insurance policies
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by policy status
        - name: productCode
          in: query
          type: string
          description: Filter by insurance product code
        - name: effectiveAfter
          in: query
          type: string
          description: Filter policies effective on or after this date (ISO 8601)
        - name: effectiveBefore
          in: query
          type: string
          description: Filter policies effective on or before this date
        - name: insuredName
          in: query
          type: string
          description: Filter by insured name (partial match)
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpolicy
        method: POST
        description: Create a new policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policies-policyid
      path: /policies/{policyId}
      operations:
      - name: getpolicy
        method: GET
        description: Get policy details
        inputParameters:
        - name: policyId
          in: path
          type: string
          required: true
          description: Unique policy identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatepolicy
        method: PUT
        description: Update policy (endorsement)
        inputParameters:
        - name: policyId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policies-policyid-cancel
      path: /policies/{policyId}/cancel
      operations:
      - name: cancelpolicy
        method: POST
        description: Cancel a policy
        inputParameters:
        - name: policyId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policies-policyid-renew
      path: /policies/{policyId}/renew
      operations:
      - name: renewpolicy
        method: POST
        description: Renew a policy
        inputParameters:
        - name: policyId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: quotes
      path: /quotes
      operations:
      - name: createquote
        method: POST
        description: Create a policy quote
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: List claims
        inputParameters:
        - name: policyId
          in: query
          type: string
          description: Filter claims for a specific policy
        - name: claimStatus
          in: query
          type: string
        - name: lossDateAfter
          in: query
          type: string
        - name: limit
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createclaim
        method: POST
        description: Report a new claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims-claimid
      path: /claims/{claimId}
      operations:
      - name: getclaim
        method: GET
        description: Get claim details
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: billing-accounts
      path: /billing/accounts
      operations:
      - name: listbillingaccounts
        method: GET
        description: List billing accounts
        inputParameters:
        - name: policyId
          in: query
          type: string
        - name: limit
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: billing-accounts-accountid-invoices
      path: /billing/accounts/{accountId}/invoices
      operations:
      - name: listinvoices
        method: GET
        description: List invoices for a billing account
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
        - name: status
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: products
      path: /products
      operations:
      - name: listproducts
        method: GET
        description: List insurance products
        inputParameters:
        - name: lineOfBusiness
          in: query
          type: string
          description: Filter by line of business
        - name: state
          in: query
          type: string
          description: Filter products available in a specific US state (2-letter code)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: duck-creek-rest
    description: REST adapter for Duck Creek Policy Administration API.
    resources:
    - path: /policies
      name: listpolicies
      operations:
      - method: GET
        name: listpolicies
        description: List insurance policies
        call: duck-creek.listpolicies
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies
      name: createpolicy
      operations:
      - method: POST
        name: createpolicy
        description: Create a new policy
        call: duck-creek.createpolicy
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies/{policyId}
      name: getpolicy
      operations:
      - method: GET
        name: getpolicy
        description: Get policy details
        call: duck-creek.getpolicy
        with:
          policyId: rest.policyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies/{policyId}
      name: updatepolicy
      operations:
      - method: PUT
        name: updatepolicy
        description: Update policy (endorsement)
        call: duck-creek.updatepolicy
        with:
          policyId: rest.policyId
        outputParameters:
        - type: object
          mapping: $.
