      - method: POST
        name: cancelpolicy
        description: Cancel a policy
        call: duck-creek.cancelpolicy
        with:
          policyId: rest.policyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies/{policyId}/renew
      name: renewpolicy
      operations:
      - method: POST
        name: renewpolicy
        description: Renew a policy
        call: duck-creek.renewpolicy
        with:
          policyId: rest.policyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /quotes
      name: createquote
      operations:
      - method: POST
        name: createquote
        description: Create a policy quote
        call: duck-creek.createquote
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims
      name: listclaims
      operations:
      - method: GET
        name: listclaims
        description: List claims
        call: duck-creek.listclaims
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims
      name: createclaim
      operations:
      - method: POST
        name: createclaim
        description: Report a new claim
        call: duck-creek.createclaim
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{claimId}
      name: getclaim
      operations:
      - method: GET
        name: getclaim
        description: Get claim details
        call: duck-creek.getclaim
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
    - path: /billing/accounts
      name: listbillingaccounts
      operations:
      - method: GET
        name: listbillingaccounts
        description: List billing accounts
        call: duck-creek.listbillingaccounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /billing/accounts/{accountId}/invoices
      name: listinvoices
      operations:
      - method: GET
        name: listinvoices
        description: List invoices for a billing account
        call: duck-creek.listinvoices
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /products
      name: listproducts
      operations:
      - method: GET
        name: listproducts
        description: List insurance products
        call: duck-creek.listproducts
        outputParameters:
        - type: object
          mapping: $.
