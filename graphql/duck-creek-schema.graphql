"""
Duck Creek Technologies GraphQL API Schema
Conceptual schema derived from Duck Creek Technologies REST API for P&C insurance SaaS.
Covers policy lifecycle, billing management, claims processing, agency management,
analytics, and digital insurance workflow configuration.
"""

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ─────────────────────────────────────────────
# Root Types
# ─────────────────────────────────────────────

type Query {
  # Policy
  policy(id: ID!): Policy
  policies(filter: PolicyFilter, pagination: Pagination): PolicyConnection
  policyQuote(id: ID!): PolicyQuote
  policyQuotes(filter: QuoteFilter, pagination: Pagination): PolicyQuoteConnection

  # Billing
  billingAccount(id: ID!): BillingAccount
  billingAccounts(filter: BillingAccountFilter, pagination: Pagination): BillingAccountConnection
  invoice(id: ID!): Invoice
  invoices(filter: InvoiceFilter, pagination: Pagination): InvoiceConnection
  payment(id: ID!): Payment
  payments(filter: PaymentFilter, pagination: Pagination): PaymentConnection
  installmentPlan(id: ID!): InstallmentPlan

  # Claims
  claim(id: ID!): Claim
  claims(filter: ClaimFilter, pagination: Pagination): ClaimConnection
  claimNote(id: ID!): ClaimNote
  claimReserve(id: ID!): ClaimReserve
  claimPayment(id: ID!): ClaimPayment
  claimDocument(id: ID!): ClaimDocument

  # Agency
  agency(id: ID!): Agency
  agencies(filter: AgencyFilter, pagination: Pagination): AgencyConnection
  agent(id: ID!): Agent
  agents(filter: AgentFilter, pagination: Pagination): AgentConnection
  producer(id: ID!): Producer
  producers(filter: ProducerFilter, pagination: Pagination): ProducerConnection

  # Insured / Customer
  insured(id: ID!): Insured
  insureds(filter: InsuredFilter, pagination: Pagination): InsuredConnection

  # Product / Configuration
  product(id: ID!): InsuranceProduct
  products(filter: ProductFilter, pagination: Pagination): InsuranceProductConnection
  coverageType(id: ID!): CoverageType
  coverageTypes(pagination: Pagination): CoverageTypeConnection
  ratingFactor(id: ID!): RatingFactor

  # Analytics
  analyticsReport(id: ID!): AnalyticsReport
  analyticsReports(filter: AnalyticsReportFilter, pagination: Pagination): AnalyticsReportConnection
  kpiSnapshot(reportingPeriod: ReportingPeriod!): KpiSnapshot

  # Documents
  document(id: ID!): Document
  documents(filter: DocumentFilter, pagination: Pagination): DocumentConnection

  # Workflow
  workflowInstance(id: ID!): WorkflowInstance
  workflowInstances(filter: WorkflowFilter, pagination: Pagination): WorkflowInstanceConnection
  workflowDefinition(id: ID!): WorkflowDefinition
}

type Mutation {
  # Policy
  createPolicyQuote(input: CreatePolicyQuoteInput!): PolicyQuote!
  updatePolicyQuote(id: ID!, input: UpdatePolicyQuoteInput!): PolicyQuote!
  bindPolicy(quoteId: ID!): Policy!
  issuePolicy(policyId: ID!, input: IssuePolicyInput!): Policy!
  renewPolicy(policyId: ID!, input: RenewPolicyInput!): Policy!
  cancelPolicy(policyId: ID!, input: CancelPolicyInput!): Policy!
  endorsePolicy(policyId: ID!, input: EndorsePolicyInput!): Policy!

  # Billing
  createBillingAccount(input: CreateBillingAccountInput!): BillingAccount!
  updateBillingAccount(id: ID!, input: UpdateBillingAccountInput!): BillingAccount!
  processPayment(input: ProcessPaymentInput!): Payment!
  voidPayment(paymentId: ID!, reason: String!): Payment!
  generateInvoice(billingAccountId: ID!): Invoice!
  createInstallmentPlan(input: CreateInstallmentPlanInput!): InstallmentPlan!

  # Claims
  fileClaim(input: FileClaimInput!): Claim!
  updateClaim(id: ID!, input: UpdateClaimInput!): Claim!
  assignClaim(claimId: ID!, adjusterId: ID!): Claim!
  addClaimNote(claimId: ID!, input: AddClaimNoteInput!): ClaimNote!
  setClaimReserve(claimId: ID!, input: SetClaimReserveInput!): ClaimReserve!
  processClaimPayment(claimId: ID!, input: ProcessClaimPaymentInput!): ClaimPayment!
  closeClaim(claimId: ID!, input: CloseClaimInput!): Claim!

  # Agency
  createAgency(input: CreateAgencyInput!): Agency!
  updateAgency(id: ID!, input: UpdateAgencyInput!): Agency!
  createAgent(input: CreateAgentInput!): Agent!
  updateAgent(id: ID!, input: UpdateAgentInput!): Agent!
  appointProducer(input: AppointProducerInput!): Producer!

  # Insured
  createInsured(input: CreateInsuredInput!): Insured!
  updateInsured(id: ID!, input: UpdateInsuredInput!): Insured!

  # Documents
  uploadDocument(input: UploadDocumentInput!): Document!
  deleteDocument(id: ID!): Boolean!

  # Workflow
  startWorkflow(input: StartWorkflowInput!): WorkflowInstance!
  completeWorkflowTask(instanceId: ID!, taskId: ID!, input: CompleteTaskInput!): WorkflowInstance!
}

type Subscription {
  policyStatusChanged(policyId: ID!): Policy!
  claimStatusChanged(claimId: ID!): Claim!
  paymentProcessed(billingAccountId: ID!): Payment!
  workflowTaskAssigned(assigneeId: ID!): WorkflowTask!
}

