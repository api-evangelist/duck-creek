description: FOCUS-aligned FinOps shape for Duck Creek. Billing is enterprise SaaS contract per carrier
  tenant; per-API-call pricing is not surfaced, though carriers often see Anywhere call volumes feed internal
  capacity planning.
notes: No public per-call meter; reconciled=false.
sources:
  - https://www.duckcreek.com/duck-creek-anywhere/
  - https://www.duckcreek.com/product/duck-creek-platform/
billingModel:
  pricingCategory: Enterprise SaaS
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
focusColumns:
  ServiceName: Duck Creek Suite
  ServiceCategory: Insurance Core SaaS
  ProviderName: Duck Creek Technologies
  PublisherName: Duck Creek Technologies, Inc.
  InvoiceIssuerName: Duck Creek Technologies, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: tenant_subscription
    description: Active Duck Creek Suite tenants
    unit: tenant
    aggregation: count
    dimensions:
      - product
  - name: policies_in_force
    description: Policies under management (typical contractual sizing dimension)
    unit: policy
    aggregation: count
    dimensions:
      - line_of_business
  - name: anywhere_api_calls
    description: Internal observability of calls against Duck Creek Anywhere
    unit: request
    aggregation: sum
    dimensions:
      - api
      - line_of_business
principles:
  - name: Visibility
    description: Reconcile the Duck Creek Suite invoice against contracted policies-in-force, products,
      and tenant scope; track Anywhere call volumes for internal capacity planning.
  - name: Allocation
    description: Allocate Duck Creek cost across personal vs. commercial lines and individual products
      (Policy, Billing, Claims).
  - name: Optimization
    description: Use Anywhere Managed Integrations rather than rebuilding third-party connectors; cache
      reference data; consolidate Anywhere call patterns to stay within tenant capacity.
  - name: Accountability
    description: Carrier IT / digital owner is accountable for Duck Creek spend and contract renewal terms.
maintainers:
